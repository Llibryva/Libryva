name: Bug Report
description: Report something that is broken or not working as expected
labels: [bug]
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Libryva!
        Please fill out the form below so we can reproduce and fix the issue faster.
        Issues are public. Remove private information from URLs, logs, and screenshots before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do you trigger this bug? Please walk us through it step by step.
      placeholder: |
        1. Open '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform did this happen on?
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
        - Web
        - Web Extension (Chrome)
        - Web Extension (Firefox)
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App, extension, or browser version
      description: Include the app/extension version and browser version when relevant.
      placeholder: "Example: 0.1.0 (Chrome 153)"
    validations:
      required: false
  - type: input
    id: page-url
    attributes:
      label: Affected page URL
      description: Optional. Include the page or route where the issue happened.
      placeholder: "https://example.com/article"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Optional. Remove access tokens, account details, and other private data before sharing.
      render: shell
  - type: upload
    id: screenshots
    attributes:
      label: Screenshot or screen recording
      description: Attach a screenshot or recording if it helps show the problem. Review it for private content first.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and found no duplicates.
          required: true
